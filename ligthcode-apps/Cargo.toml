[package]
name = "lightcode"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
arboard = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
futures-util = "0.3"
ignore = "0.4"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process"] }
toml = "0.8"
unicode-segmentation = "1"
unicode-width = "0.2"
